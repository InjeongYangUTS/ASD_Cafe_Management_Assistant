<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .dashboard-container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 90px;

            padding: 60px;
        }

        .dashboard-card {
            width: 520px;
            height: 620px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            text-decoration: none;
            color: black;

            border-radius: 25px;

            transition: transform 0.2s ease;
        }

        .dashboard-card:hover {
            box-shadow: 0 0 0 20px #e5e5e5;
        }

        .order-card {
            border: 10px solid #ffcaca;
        }

        .feedback-card {
            border: 10px solid #c7ddff;
        }

        .dashboard-icon {
            width: 150px;
            height: 150px;

            margin-bottom: 45px;
        }

        .dashboard-card h2 {
            margin: 0 0 55px 0;

            font-size: 40px;
            font-weight: bold;
        }

        .dashboard-card p {
            margin: 0;

            font-size: 28px;
            line-height: 1.35;
        }
    </style>
</head>

<body>

    <main class="dashboard-container">

        <!-- Place an Order -->
        <a href="#" class="dashboard-card order-card">

            <img
                src="/shared/assets/icons/drink.svg"
                alt="Order icon"
                class="dashboard-icon"
            >

            <h2>Place an Order</h2>

            <p>
                Browse the menu &<br>
                place your order!
            </p>

        </a>


        <!-- Feedback & Reviews -->
        <a href="#" class="dashboard-card feedback-card">

            <img
                src="/shared/assets/icons/feedback.svg"
                alt="Feedback icon"
                class="dashboard-icon"
            >

            <h2>Feedback & Reviews</h2>

            <p>
                Give us feedback &<br>
                share your opinion!
            </p>

        </a>

    </main>

</body>
</html>
