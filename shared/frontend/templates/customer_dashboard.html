<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Dashboard</title>

    <link rel="stylesheet" href="/shared/css/style.css">
</head>

<body>

    <header class="page-header">
        <h1>Customer Dashboard</h1>
        <p>What would you like to do?</p>
    </header>

    <main class="dashboard-selection">

        <!-- Place an Order -->
        <a href="#" class="dashboard-card order-card">

            <img src="/shared/assets/icons/drink.svg" alt="Order icon" class="dashboard-icon">

            <h2>Place an Order</h2>

            <p>
                Browse the menu &<br>
                place your order!
            </p>

        </a>


        <!-- Feedback & Reviews -->
        <a href="#" class="dashboard-card feedback-card">

            <img src="/shared/assets/icons/feedback.svg" alt="Feedback icon" class="dashboard-icon">

            <h2>Feedback & Reviews</h2>

            <p>
                Give us feedback &<br>
                share your opinion!
            </p>

        </a>

    </main>

</body>

</html>
