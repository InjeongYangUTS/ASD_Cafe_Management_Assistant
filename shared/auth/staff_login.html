<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff / Admin Login | Cafe Management Assistant</title>

    <link rel="stylesheet" href="/shared/css/style.css">
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <!-- Staff / Admin Icon -->
            <img
                src="/shared/assets/icons/staff.svg"
                alt="Staff / Admin"
                class="auth-icon"
            >

            <header class="auth-header">
                <h1>Staff / Admin Login</h1>
                <p>Welcome back! Please sign in to continue.</p>
            </header>

            <form action="/staff-login" method="POST" class="auth-form">

                <h2>Sign In</h2>

                <!-- Email -->
                <div class="form-group">

                    <label for="staff_email">
                        Email:
                    </label>

                    <input
                        type="email"
                        id="staff_email"
                        name="staff_email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password:
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                    <p
                        id="error-message"
                        class="error-message"
                    >
                        <strong>Error:</strong>
                        Incorrect Email or Password
                    </p>

                </div>

                <button type="submit" class="auth-button">
                    Login
                </button>

            </form>

            <p class="auth-link">
                Don't have an account?
                <a href="/shared/auth/staff_register.html">
                    Register
                </a>
            </p>

            <p class="back-link">
                <a href="/">← Back to Home</a>
            </p>

        </div>

    </main>

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        if (params.get("error") === "1") {

            document
                .getElementById("error-message")
                .style.display = "block";
        }

    </script>

</body>

</html>
