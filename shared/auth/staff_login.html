<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .login-container {
            display: flex;
            width: 100%;
            min-height: 100vh;

            align-items: center;
            justify-content: center;

            gap: 180px;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 80px;
        }

        .user-icon {
            width: 180px;
            height: 180px;
        }

        .create-account {
            font-size: 26px;
            color: #6aa8e8;
            text-decoration: underline;
        }

        .right-section {
            width: 520px;
        }

        .right-section h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 70px;
        }

        .form-group {
            margin-bottom: 40px;
            transform: translateY(-20px);
        }

        .password-group {
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 70px;

            border: none;

            background-color: #e8e8e8;

            font-size: 24px;
            padding: 10px 15px;
        }

        .error-message {
            display: none;

            position: absolute;
            top: 115%;
            left: 0;
            width: 100%;

            color: #c62828;
            text-align: center;

            font-size: 22px;

            margin: 0;
        }

        .login-button {
            width: 100%;
            height: 90px;

            margin-top: 35px;

            border: none;
            border-radius: 28px;

            background-color: #3967b4;
            color: white;

            font-size: 30px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background-color: #315a9e;
        }
    </style>
</head>


<body>

    <div class="login-container">


        <div class="left-section">

            <img
                src="/shared/assets/icons/customer.svg"
                alt="Customer icon"
                class="user-icon"
            >


            <a
                href="/shared/auth/customer_register.html"
                class="create-account"
            >
                Create a new account
            </a>

        </div>


        <div class="right-section">

            <h1>Customer Login</h1>


            <form
                method="POST"
                action="/customer-login"
            >

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group password-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >


                    <p
                        id="error-message"
                        class="error-message"
                    >
                        <strong>Error:</strong>
                        Incorrect Email or Password
                    </p>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

        </div>

    </div>


    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        if (params.get("error") === "1") {

            document
                .getElementById("error-message")
                .style.display = "block";
        }

    </script>

</body>

</html>
