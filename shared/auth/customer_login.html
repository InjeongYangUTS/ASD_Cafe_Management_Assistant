<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login | Cafe Management Assistant</title>

    <link rel="stylesheet" href="/shared/css/style.css">
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <img src="/shared/assets/icons/customer.svg" alt="Customer" class="auth-icon">

            <header class="auth-header">
                <h1>Customer Login</h1>
                <p>Welcome back! Please sign in to continue.</p>
            </header>

            <p id="success-message" style="display: none; color: #2e7d32; font-size: 16px; margin: -20px 0 20px;">
                <strong>Success:</strong> Account created! Please log in.
            </p>

            <form action="/customer-login" method="POST" class="auth-form">

                <h2>Sign In</h2>

                <div class="form-group">
                    <label for="customer-email">Email</label>

                    <input type="email" id="customer-email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>

                    <input type="password" id="password" name="password" placeholder="Enter your password" required>

                    <p id="error-message" style="display: none; color: red; font-size: 18px; margin-top: 10px;">
                        <strong>Error:</strong> Incorrect Email or Password
                    </p>
                </div>

                <button type="submit" class="auth-button">
                    Login
                </button>

            </form>

            <p class="auth-link">
                Don't have an account?
                <a href="/shared/auth/customer_register.html">Register</a>
            </p>

            <p class="back-link">
                <a href="/">← Back to Home</a>
            </p>

        </div>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const errorMessage = document.getElementById("error-message");
        const successMessage = document.getElementById("success-message");

        if (params.get("error") === "1") {
            errorMessage.style.display = "block";
        }

        if (params.get("registered") === "1") {
            successMessage.style.display = "block";
        }
    </script>

</body>

</html>
