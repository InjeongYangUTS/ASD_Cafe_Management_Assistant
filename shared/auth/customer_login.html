<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .login-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            gap: 180px;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 80px;
        }

        .customer-icon {
            width: 180px;
            height: 180px;
        }

        .create-account {
            font-size: 26px;
            color: #6aa8e8;
            text-decoration: underline;
        }

        .right-section {
            width: 520px;
        }

        .right-section h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 70px;
        }

        .form-group {
            margin-bottom: 40px;
            transform: translateY(-20px);
        }

        .form-group label {
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 70px;
            border: none;
            background-color: #e8e8e8;
            font-size: 24px;
            padding: 10px 15px;
        }

        .login-button {
            width: 100%;
            height: 90px;
            margin-top: 35px;
            border: none;
            border-radius: 28px;
            background-color: #3967b4;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #315a9e;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="left-section">

            <img
                src="/shared/assets/icons/customer.svg"
                alt="Customer icon"
                class="customer-icon"
            >

            <a
                href="/shared/auth/customer_register.html"
                class="create-account"
            >
                Create a new account
            </a>

        </div>

        <div class="right-section">

            <h1>Customer Login</h1>

            <form>

                <div class="form-group">
                    <label for="customer-id">ID</label>
                    <input
                        type="text"
                        id="customer-id"
                        name="customer_id"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                    >
                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

        </div>

    </div>

</body>
</html>
