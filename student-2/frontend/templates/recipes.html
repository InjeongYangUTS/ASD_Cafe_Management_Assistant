<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipes | Cafe Management Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="management-container">

        <!-- HEADER -->

        <header class="management-header">

            <div>
                <h1>Recipes</h1>
                <p>Manage recipes for cafe menu items.</p>
            </div>

            <a href="/" class="secondary-button">
                ← Back
            </a>

        </header>


        <!-- ADD / UPDATE RECIPE -->

        <section class="management-section">

            <div class="section-heading">

                <div>
                    <h2>Recipe Details</h2>
                    <p>
                        Add a new recipe or update an existing recipe.
                    </p>
                </div>

            </div>


            <form
                id="recipe-form"
                class="management-form"
            >

                <div class="form-row">

                    <!-- MENU ITEM -->

                    <div class="form-group">

                        <label for="recipe-menu-item">
                            Menu Item
                        </label>

                        <select
                            id="recipe-menu-item"
                            name="menu_id"
                            required
                        >
                            <option value="">
                                Select menu item
                            </option>
                        </select>

                    </div>


                    <!-- RECIPE NAME -->

                    <div class="form-group">

                        <label for="recipe-name">
                            Recipe Name
                        </label>

                        <input
                            type="text"
                            id="recipe-name"
                            name="name"
                            placeholder="e.g. Cappuccino Recipe"
                            required
                        >

                    </div>

                </div>


                <!-- INSTRUCTIONS -->

                <div class="form-group">

                    <label for="recipe-instructions">
                        Instructions
                    </label>

                    <textarea
                        id="recipe-instructions"
                        name="instructions"
                        rows="5"
                        placeholder="Enter recipe preparation instructions..."
                        required
                    ></textarea>

                </div>


                <!-- FORM BUTTONS -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Add Recipe
                    </button>

                    <button
                        type="reset"
                        class="secondary-button"
                    >
                        Clear
                    </button>

                </div>


                <!-- SUCCESS MESSAGE -->

                <p
                    id="recipe-success-message"
                    class="success-message"
                ></p>

            </form>

        </section>


        <!-- CURRENT RECIPES -->

        <section class="management-section">

            <div class="section-heading">

                <div>
                    <h2>Current Recipes</h2>
                    <p>
                        View and manage recipes linked to menu items.
                    </p>
                </div>


                <!-- SEARCH -->

                <input
                    type="text"
                    id="recipe-search"
                    class="search-input"
                    placeholder="Search recipes..."
                >

            </div>


            <!-- RECIPE TABLE -->

            <div class="table-wrapper">

                <table class="management-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Menu Item</th>
                            <th>Recipe Name</th>
                            <th>Instructions</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="recipe-table-body">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script>

        // --------------------------------
        // API URLS
        // --------------------------------

        const RECIPE_API =
            "http://localhost:5201/api/recipes";

        const MENU_API =
            "http://localhost:5201/api/menus";


        // --------------------------------
        // EDITING STATE
        // --------------------------------

        let editingRecipeId = null;

        let allRecipes = [];


        // --------------------------------
        // SUCCESS MESSAGE
        // --------------------------------

        function showRecipeSuccessMessage(message) {

            const successMessage =
                document.getElementById(
                    "recipe-success-message"
                );

            successMessage.textContent = message;

            successMessage.style.display = "block";


            setTimeout(() => {

                successMessage.style.display = "none";

            }, 3000);
        }


        // --------------------------------
        // LOAD MENU ITEMS
        // --------------------------------

        async function loadMenuItems() {

            try {

                const response =
                    await fetch(MENU_API);

                if (!response.ok) {

                    throw new Error(
                        "Failed to load menu items"
                    );
                }


                const menus =
                    await response.json();


                const menuSelect =
                    document.getElementById(
                        "recipe-menu-item"
                    );


                menuSelect.innerHTML = `
                    <option value="">
                        Select menu item
                    </option>
                `;


                menus.forEach(menu => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        menu.menu_id;

                    option.textContent =
                        menu.name;

                    menuSelect.appendChild(
                        option
                    );
                });

            }

            catch (error) {

                console.error(
                    "Error loading menu items:",
                    error
                );
            }
        }


        // --------------------------------
        // DISPLAY RECIPES
        // --------------------------------

        function displayRecipes(recipes) {

            const tableBody =
                document.getElementById(
                    "recipe-table-body"
                );


            tableBody.innerHTML = "";


            recipes.forEach(recipe => {

                const row =
                    document.createElement("tr");


                const idCell =
                    document.createElement("td");

                idCell.textContent =
                    recipe.recipe_id;


                const menuCell =
                    document.createElement("td");

                menuCell.textContent =
                    recipe.menu_name || "";


                const nameCell =
                    document.createElement("td");

                nameCell.textContent =
                    recipe.name;


                const instructionsCell =
                    document.createElement("td");

                instructionsCell.textContent =
                    recipe.instructions;


                const actionsCell =
                    document.createElement("td");


                const actions =
                    document.createElement("div");

                actions.className =
                    "action-buttons";


                // EDIT BUTTON

                const editButton =
                    document.createElement("button");

                editButton.type = "button";

                editButton.className =
                    "edit-button";

                editButton.textContent =
                    "Edit";

                editButton.addEventListener(
                    "click",
                    function() {

                        editRecipe(
                            recipe.recipe_id
                        );
                    }
                );


                // DELETE BUTTON

                const deleteButton =
                    document.createElement("button");

                deleteButton.type = "button";

                deleteButton.className =
                    "delete-button";

                deleteButton.textContent =
                    "Delete";

                deleteButton.addEventListener(
                    "click",
                    function() {

                        deleteRecipe(
                            recipe.recipe_id,
                            recipe.name
                        );
                    }
                );


                actions.appendChild(
                    editButton
                );

                actions.appendChild(
                    deleteButton
                );

                actionsCell.appendChild(
                    actions
                );


                row.appendChild(
                    idCell
                );

                row.appendChild(
                    menuCell
                );

                row.appendChild(
                    nameCell
                );

                row.appendChild(
                    instructionsCell
                );

                row.appendChild(
                    actionsCell
                );


                tableBody.appendChild(
                    row
                );
            });
        }


        // --------------------------------
        // LOAD RECIPES
        // --------------------------------

        async function loadRecipes() {

            try {

                const response =
                    await fetch(RECIPE_API);


                if (!response.ok) {

                    throw new Error(
                        "Failed to load recipes"
                    );
                }


                allRecipes =
                    await response.json();


                displayRecipes(
                    allRecipes
                );

            }

            catch (error) {

                console.error(
                    "Error loading recipes:",
                    error
                );
            }
        }


        // --------------------------------
        // EDIT RECIPE
        // --------------------------------

        async function editRecipe(recipeId) {

            try {

                const response =
                    await fetch(
                        `${RECIPE_API}/${recipeId}`
                    );


                const recipe =
                    await response.json();


                if (!response.ok) {

                    alert(
                        recipe.error ||
                        "Failed to load recipe"
                    );

                    return;
                }


                document.getElementById(
                    "recipe-menu-item"
                ).value =
                    recipe.menu_id;


                document.getElementById(
                    "recipe-name"
                ).value =
                    recipe.name;


                document.getElementById(
                    "recipe-instructions"
                ).value =
                    recipe.instructions;


                editingRecipeId =
                    recipeId;


                document.querySelector(
                    "#recipe-form .primary-button"
                ).textContent =
                    "Update Recipe";


                document.getElementById(
                    "recipe-form"
                ).scrollIntoView({

                    behavior: "smooth",
                    block: "center"

                });

            }

            catch (error) {

                console.error(
                    "Error loading recipe:",
                    error
                );

                alert(
                    "Unable to load recipe."
                );
            }
        }


        // --------------------------------
        // ADD / UPDATE RECIPE
        // --------------------------------

        const recipeForm =
            document.getElementById(
                "recipe-form"
            );


        recipeForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const recipeData = {

                    menu_id: Number(
                        document.getElementById(
                            "recipe-menu-item"
                        ).value
                    ),

                    name:
                        document.getElementById(
                            "recipe-name"
                        ).value.trim(),

                    instructions:
                        document.getElementById(
                            "recipe-instructions"
                        ).value.trim()
                };


                const wasEditing =
                    editingRecipeId !== null;


                let url =
                    RECIPE_API;

                let method =
                    "POST";


                if (wasEditing) {

                    url =
                        `${RECIPE_API}/${editingRecipeId}`;

                    method =
                        "PUT";
                }


                try {

                    const response =
                        await fetch(
                            url,
                            {

                                method: method,

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        recipeData
                                    )
                            }
                        );


                    const result =
                        await response.json();


                    if (!response.ok) {

                        alert(
                            result.error ||
                            "Failed to save recipe"
                        );

                        return;
                    }


                    recipeForm.reset();

                    editingRecipeId =
                        null;


                    document.querySelector(
                        "#recipe-form .primary-button"
                    ).textContent =
                        "Add Recipe";


                    await loadRecipes();


                    if (wasEditing) {

                        showRecipeSuccessMessage(
                            "Recipe updated successfully."
                        );

                    } else {

                        showRecipeSuccessMessage(
                            "Recipe added successfully."
                        );
                    }

                }

                catch (error) {

                    console.error(
                        "Error saving recipe:",
                        error
                    );

                    alert(
                        "Unable to save recipe."
                    );
                }
            }
        );


        // --------------------------------
        // DELETE RECIPE
        // --------------------------------

        async function deleteRecipe(
            recipeId,
            recipeName
        ) {

            const confirmed =
                confirm(
                    `Are you sure you want to delete "${recipeName}"?`
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${RECIPE_API}/${recipeId}`,
                        {
                            method: "DELETE"
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    alert(
                        result.error ||
                        "Failed to delete recipe"
                    );

                    return;
                }


                await loadRecipes();


                showRecipeSuccessMessage(
                    "Recipe deleted successfully."
                );


                document
                    .getElementById(
                        "recipe-success-message"
                    )
                    .scrollIntoView({

                        behavior: "smooth",
                        block: "center"

                    });

            }

            catch (error) {

                console.error(
                    "Error deleting recipe:",
                    error
                );

                alert(
                    "Unable to delete recipe."
                );
            }
        }


        // --------------------------------
        // CLEAR / RESET FORM
        // --------------------------------

        recipeForm.addEventListener(
            "reset",
            function() {

                editingRecipeId =
                    null;


                document.querySelector(
                    "#recipe-form .primary-button"
                ).textContent =
                    "Add Recipe";
            }
        );


        // --------------------------------
        // SEARCH RECIPES
        // --------------------------------

        const recipeSearch =
            document.getElementById(
                "recipe-search"
            );


        recipeSearch.addEventListener(
            "input",
            function() {

                const searchValue =
                    recipeSearch.value
                        .toLowerCase()
                        .trim();


                const filteredRecipes =
                    allRecipes.filter(
                        recipe => {

                            const menuName =
                                (
                                    recipe.menu_name ||
                                    ""
                                ).toLowerCase();


                            const recipeName =
                                (
                                    recipe.name ||
                                    ""
                                ).toLowerCase();


                            const instructions =
                                (
                                    recipe.instructions ||
                                    ""
                                ).toLowerCase();


                            return (
                                menuName.includes(
                                    searchValue
                                ) ||

                                recipeName.includes(
                                    searchValue
                                ) ||

                                instructions.includes(
                                    searchValue
                                )
                            );
                        }
                    );


                displayRecipes(
                    filteredRecipes
                );
            }
        );


        // --------------------------------
        // INITIAL PAGE LOAD
        // --------------------------------

        loadMenuItems();

        loadRecipes();

    </script>

</body>

</html>
