<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingredients | Cafe Management Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="management-container">

        <!-- HEADER -->

        <header class="management-header">

            <div>
                <h1>Ingredients</h1>
                <p>Manage ingredients and ingredient costs.</p>
            </div>

            <a href="/" class="secondary-button">
                ← Back
            </a>

        </header>


        <!-- ADD INGREDIENT -->

        <section class="management-section">

            <div class="section-heading">

                <div>
                    <h2>Add Ingredient</h2>
                    <p>Add a new ingredient and its current unit cost.</p>
                </div>

            </div>


            <form id="ingredient-form" class="management-form">

                <div class="form-row">

                    <!-- INGREDIENT NAME -->

                    <div class="form-group">

                        <label for="ingredient-name">
                            Ingredient Name
                        </label>

                        <input
                            type="text"
                            id="ingredient-name"
                            name="name"
                            placeholder="e.g. Coffee Beans"
                            required
                        >

                    </div>


                    <!-- UNIT -->

                    <div class="form-group">

                        <label for="ingredient-unit">
                            Unit
                        </label>

                        <select
                            id="ingredient-unit"
                            name="unit"
                            required
                        >
                            <option value="">Select unit</option>
                            <option value="g">g</option>
                            <option value="ml">ml</option>
                            <option value="slice">slice</option>
                            <option value="each">each</option>
                        </select>

                    </div>

                </div>


                <!-- UNIT COST -->

                <div class="form-group">

                    <label for="ingredient-cost">
                        Unit Cost ($)
                    </label>

                    <input
                        type="number"
                        id="ingredient-cost"
                        name="unit_cost"
                        min="0"
                        step="0.001"
                        placeholder="0.000"
                        required
                    >

                </div>


                <!-- FORM BUTTONS -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Add Ingredient
                    </button>

                    <button
                        type="reset"
                        class="secondary-button"
                    >
                        Clear
                    </button>

                </div>

                <p id="ingredient-success-message" class="success-message"></p>

            </form>

        </section>


        <!-- CURRENT INGREDIENTS -->

        <section class="management-section">

            <div class="section-heading">

                <div>
                    <h2>Current Ingredients</h2>
                    <p>
                        View ingredient units and current costs.
                    </p>
                </div>


                <!-- SEARCH -->

                <input
                    type="text"
                    id="ingredient-search"
                    class="search-input"
                    placeholder="Search ingredients..."
                >

            </div>


            <!-- INGREDIENT TABLE -->

            <div class="table-wrapper">

                <table class="management-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Ingredient</th>
                            <th>Unit</th>
                            <th>Unit Cost</th>
                            <th>Actions</th>
                        </tr>

                    </thead>


                    <!--
                        Ingredients are loaded from the
                        backend API.
                    -->

                    <tbody id="ingredient-table-body">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script>

        const INGREDIENT_API =
            "http://localhost:5201/api/ingredients";

        let editingIngredientId = null;

        function showIngredientSuccessMessage(message) {

            const successMessage =
                document.getElementById("ingredient-success-message");

            successMessage.textContent = message;
            successMessage.style.display = "block";

            setTimeout(() => {
                successMessage.style.display = "none";
            }, 3000);
        }

        // --------------------------------
        // LOAD INGREDIENTS FROM BACKEND
        // --------------------------------

        async function loadIngredients() {

            try {

                const response =
                    await fetch(INGREDIENT_API);

                if (!response.ok) {
                    throw new Error(
                        "Failed to load ingredients"
                    );
                }

                const ingredients =
                    await response.json();

                const tableBody =
                    document.getElementById(
                        "ingredient-table-body"
                    );

                tableBody.innerHTML = "";


                ingredients.forEach(ingredient => {

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `
                        <td>
                            ${ingredient.ingredient_id}
                        </td>

                        <td>
                            ${ingredient.name}
                        </td>

                        <td>
                            ${ingredient.unit}
                        </td>

                        <td>
                            $${Number(
                                ingredient.unit_cost
                            ).toFixed(3)}
                        </td>

                        <td>

                            <div class="action-buttons">

                                <button
                                    class="edit-button"
                                    data-id="${ingredient.ingredient_id}"
                                    onclick="editIngredient(${ingredient.ingredient_id})"
                                >
                                    Edit
                                </button>

                                <button
                                    class="delete-button"
                                    data-id="${ingredient.ingredient_id}"
                                    onclick="deleteIngredient(${ingredient.ingredient_id}, '${ingredient.name.replace(/'/g, "\\'")}')"
                                >
                                    Delete
                                </button>

                            </div>
                            
                        </td>
                    `;

                    tableBody.appendChild(row);

                });

            }

            catch (error) {

                console.error(
                    "Error loading ingredients:",
                    error
                );

            }

        }


        // Load ingredients when page opens
        loadIngredients();

        // --------------------------------
        // EDIT INGREDIENT
        // --------------------------------

        async function editIngredient(ingredientId) {

            try {

                const response = await fetch(
                    `${INGREDIENT_API}/${ingredientId}`
                );

                const ingredient = await response.json();

                if (!response.ok) {
                    alert(
                        ingredient.error ||
                        "Failed to load ingredient"
                    );
                    return;
                }

                document.getElementById(
                    "ingredient-name"
                ).value = ingredient.name;

                document.getElementById(
                    "ingredient-unit"
                ).value = ingredient.unit;

                document.getElementById(
                    "ingredient-cost"
                ).value = ingredient.unit_cost;

                editingIngredientId = ingredientId;

                document.querySelector(
                    "#ingredient-form .primary-button"
                ).textContent = "Update Ingredient";

                document.getElementById(
                    "ingredient-form"
                ).scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            } catch (error) {

                console.error(
                    "Error loading ingredient:",
                    error
                );

                alert("Unable to load ingredient.");
            }
        }

        // --------------------------------
        // DELETE INGREDIENT
        // --------------------------------

        async function deleteIngredient(
            ingredientId,
            ingredientName
        ) {

            const confirmed = confirm(
                `Are you sure you want to delete "${ingredientName}"?`
            );

            if (!confirmed) {
                return;
            }

            try {

                const response = await fetch(
                    `${INGREDIENT_API}/${ingredientId}`,
                    {
                        method: "DELETE"
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    alert(
                        result.error ||
                        "Failed to delete ingredient"
                    );
                    return;
                }

                await loadIngredients();

                showIngredientSuccessMessage(
                    "Ingredient deleted successfully."
                );

                document
                    .getElementById("ingredient-success-message")
                    .scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });

            } catch (error) {

                console.error(
                    "Error deleting ingredient:",
                    error
                );

                alert("Unable to delete ingredient.");
            }
        }

        // --------------------------------
        // ADD NEW INGREDIENT
        // --------------------------------

        const ingredientForm =
            document.getElementById("ingredient-form");

        ingredientForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const name =
                    document.getElementById(
                        "ingredient-name"
                    ).value;

                const unit =
                    document.getElementById(
                        "ingredient-unit"
                    ).value;

                const unitCost =
                    document.getElementById(
                        "ingredient-cost"
                    ).value;


                const newIngredient = {
                    name: name,
                    unit: unit,
                    unit_cost: Number(unitCost)
                };


                try {

                    const wasEditing = editingIngredientId !== null;

                    let url = INGREDIENT_API;
                    let method = "POST";

                    if (editingIngredientId !== null) {
                        url = `${INGREDIENT_API}/${editingIngredientId}`;
                        method = "PUT";
                    }

                    const response = await fetch(
                        url,
                        {
                            method: method,

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(
                                newIngredient
                            )
                        }
                    );


                    const result =
                        await response.json();


                    if (!response.ok) {

                        alert(
                            result.error ||
                            "Failed to add ingredient"
                        );

                        return;
                    }


                    ingredientForm.reset();

                    editingIngredientId = null;

                    document.querySelector(
                        "#ingredient-form .primary-button"
                    ).textContent = "Add Ingredient";

                    await loadIngredients();

                    if (wasEditing) {
                        showIngredientSuccessMessage(
                            "Ingredient updated successfully."
                        );
                    } else {
                        showIngredientSuccessMessage(
                            "Ingredient added successfully."
                        );
                    }

                }

                catch (error) {

                    console.error(
                        "Error adding ingredient:",
                        error
                    );

                    alert(
                        "Unable to add ingredient."
                    );

                }

            }
        );

    </script>

</body>

</html>
