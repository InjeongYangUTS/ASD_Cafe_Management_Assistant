<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingredients | Cafe Management Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="management-container">

        <!-- HEADER -->

        <header class="management-header">

            <div>
                <h1>Ingredients</h1>
                <p>Manage ingredients and ingredient costs.</p>
            </div>

            <a href="/" class="secondary-button">
                ← Back
            </a>

        </header>


        <!-- ADD INGREDIENT -->

        <section class="management-section">

            <div class="section-heading">

                <div>
                    <h2>Add Ingredient</h2>
                    <p>Add a new ingredient and its current unit cost.</p>
                </div>

            </div>


            <form id="ingredient-form" class="management-form">

                <div class="form-row">

                    <!-- INGREDIENT NAME -->

                    <div class="form-group">

                        <label for="ingredient-name">
                            Ingredient Name
                        </label>

                        <input
                            type="text"
                            id="ingredient-name"
                            name="name"
                            placeholder="e.g. Coffee Beans"
                            required
                        >

                    </div>


                    <!-- UNIT -->

                    <div class="form-group">

                        <label for="ingredient-unit">
                            Unit
                        </label>

                        <select
                            id="ingredient-unit"
                            name="unit"
                            required
                        >
                            <option value="">Select unit</option>
                            <option value="g">g</option>
                            <option value="ml">ml</option>
                            <option value="slice">slice</option>
                            <option value="each">each</option>
                        </select>

                    </div>

                </div>


                <!-- UNIT COST -->

                <div class="form-group">

                    <label for="ingredient-cost">
                        Unit Cost ($)
                    </label>

                    <input
                        type="number"
                        id="ingredient-cost"
                        name="unit_cost"
                        min="0"
                        step="0.001"
                        placeholder="0.000"
                        required
                    >

                </div>


                <!-- FORM BUTTONS -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Add Ingredient
                    </button>

                    <button
                        type="reset"
                        class="secondary-button"
                    >
                        Clear
                    </button>

                </div>

            </form>

        </section>


        <!-- CURRENT INGREDIENTS -->

        <section class="management-section">

            <div class="section-heading">

                <div>
                    <h2>Current Ingredients</h2>
                    <p>
                        View ingredient units and current costs.
                    </p>
                </div>


                <!-- SEARCH -->

                <input
                    type="text"
                    id="ingredient-search"
                    class="search-input"
                    placeholder="Search ingredients..."
                >

            </div>


            <!-- INGREDIENT TABLE -->

            <div class="table-wrapper">

                <table class="management-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Ingredient</th>
                            <th>Unit</th>
                            <th>Unit Cost</th>
                            <th>Actions</th>
                        </tr>

                    </thead>


                    <!--
                        Ingredients are loaded from the
                        backend API.
                    -->

                    <tbody id="ingredient-table-body">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script>

        const INGREDIENT_API =
            "http://localhost:5201/api/ingredients";


        // --------------------------------
        // LOAD INGREDIENTS FROM BACKEND
        // --------------------------------

        async function loadIngredients() {

            try {

                const response =
                    await fetch(INGREDIENT_API);

                if (!response.ok) {
                    throw new Error(
                        "Failed to load ingredients"
                    );
                }

                const ingredients =
                    await response.json();

                const tableBody =
                    document.getElementById(
                        "ingredient-table-body"
                    );

                tableBody.innerHTML = "";


                ingredients.forEach(ingredient => {

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `
                        <td>
                            ${ingredient.ingredient_id}
                        </td>

                        <td>
                            ${ingredient.name}
                        </td>

                        <td>
                            ${ingredient.unit}
                        </td>

                        <td>
                            $${Number(
                                ingredient.unit_cost
                            ).toFixed(3)}
                        </td>

                        <td>

                            <div class="action-buttons">

                                <button
                                    class="edit-button"
                                    data-id="${ingredient.ingredient_id}"
                                >
                                    Edit
                                </button>

                                <button
                                    class="delete-button"
                                    data-id="${ingredient.ingredient_id}"
                                >
                                    Delete
                                </button>

                            </div>

                        </td>
                    `;

                    tableBody.appendChild(row);

                });

            }

            catch (error) {

                console.error(
                    "Error loading ingredients:",
                    error
                );

            }

        }


        // Load ingredients when page opens
        loadIngredients();

    </script>

</body>

</html>
