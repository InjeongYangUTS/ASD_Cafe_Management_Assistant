<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Menu | Cafe Management Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="customer-menu-container">

        <!-- HEADER -->

        <header class="customer-menu-header">

            <div>
                <h1>Menu</h1>
                <p>Browse our available food and drinks.</p>
            </div>

            <a
                href="http://localhost:5100/customer-dashboard"
                class="secondary-button"
            >
                ← Back
            </a>

        </header>


        <!-- SEARCH / FILTER -->

        <section class="customer-menu-toolbar">

            <input
                type="text"
                id="menu-search"
                class="search-input"
                placeholder="Search menu items..."
            >

            <select
                id="category-filter"
                class="filter-select"
            >
                <option value="">
                    All Categories
                </option>
            </select>

        </section>


        <!-- MENU GRID -->

        <section
            id="customer-menu-grid"
            class="customer-menu-grid"
        >
        </section>


        <!-- EMPTY MESSAGE -->

        <p
            id="no-menu-results"
            style="display: none;"
        >
            No menu items found.
        </p>

    </main>


    <script>

        // --------------------------------
        // API
        // --------------------------------

        const MENU_API =
            "http://localhost:5201/api/menus";


        // --------------------------------
        // STATE
        // --------------------------------

        let allMenuItems = [];


        // --------------------------------
        // DISPLAY MENU ITEMS
        // --------------------------------

        function displayMenuItems(items) {

            const menuGrid =
                document.getElementById(
                    "customer-menu-grid"
                );

            const noResults =
                document.getElementById(
                    "no-menu-results"
                );


            menuGrid.innerHTML = "";


            if (items.length === 0) {

                noResults.style.display =
                    "block";

                return;
            }


            noResults.style.display =
                "none";


            items.forEach(item => {

                const card =
                    document.createElement(
                        "article"
                    );

                card.className =
                    "customer-menu-card";


                const category =
                    document.createElement(
                        "span"
                    );

                category.className =
                    "menu-card-category";

                category.textContent =
                    item.category;


                const name =
                    document.createElement(
                        "h2"
                    );

                name.textContent =
                    item.name;


                const description =
                    document.createElement(
                        "p"
                    );

                description.textContent =
                    item.description || "";


                const footer =
                    document.createElement(
                        "div"
                    );

                footer.className =
                    "customer-menu-footer";


                const price =
                    document.createElement(
                        "span"
                    );

                price.className =
                    "menu-price";

                price.textContent =
                    `$${Number(item.price).toFixed(2)}`;


                const orderButton =
                    document.createElement(
                        "button"
                    );

                orderButton.type =
                    "button";

                orderButton.className =
                    "primary-button";

                orderButton.textContent =
                    "Add to Order";

                orderButton.dataset.menuId =
                    item.menu_id;


                orderButton.addEventListener(
                    "click",
                    function() {

                        handleAddToOrder(
                            item
                        );
                    }
                );


                footer.appendChild(
                    price
                );

                footer.appendChild(
                    orderButton
                );


                card.appendChild(
                    category
                );

                card.appendChild(
                    name
                );

                card.appendChild(
                    description
                );

                card.appendChild(
                    footer
                );


                menuGrid.appendChild(
                    card
                );
            });
        }


        // --------------------------------
        // LOAD MENU ITEMS
        // --------------------------------

        async function loadMenuItems() {

            try {

                const response =
                    await fetch(
                        MENU_API
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load menu"
                    );
                }


                allMenuItems =
                    await response.json();


                populateCategories(
                    allMenuItems
                );


                displayMenuItems(
                    allMenuItems
                );

            }

            catch (error) {

                console.error(
                    "Error loading menu:",
                    error
                );


                const menuGrid =
                    document.getElementById(
                        "customer-menu-grid"
                    );


                menuGrid.innerHTML = `
                    <p>
                        Unable to load the menu.
                    </p>
                `;
            }
        }


        // --------------------------------
        // CATEGORY FILTER OPTIONS
        // --------------------------------

        function populateCategories(items) {

            const categoryFilter =
                document.getElementById(
                    "category-filter"
                );


            const categories = [
                ...new Set(
                    items
                        .map(
                            item =>
                                item.category
                        )
                        .filter(Boolean)
                )
            ];


            categories.sort();


            categories.forEach(
                categoryName => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        categoryName;

                    option.textContent =
                        categoryName;


                    categoryFilter.appendChild(
                        option
                    );
                }
            );
        }


        // --------------------------------
        // SEARCH + FILTER
        // --------------------------------

        function filterMenuItems() {

            const searchValue =
                document.getElementById(
                    "menu-search"
                )
                .value
                .toLowerCase()
                .trim();


            const selectedCategory =
                document.getElementById(
                    "category-filter"
                ).value;


            const filteredItems =
                allMenuItems.filter(
                    item => {

                        const name =
                            (
                                item.name ||
                                ""
                            ).toLowerCase();


                        const category =
                            (
                                item.category ||
                                ""
                            ).toLowerCase();


                        const description =
                            (
                                item.description ||
                                ""
                            ).toLowerCase();


                        const matchesSearch =
                            name.includes(
                                searchValue
                            ) ||

                            category.includes(
                                searchValue
                            ) ||

                            description.includes(
                                searchValue
                            );


                        const matchesCategory =
                            selectedCategory === "" ||

                            item.category ===
                                selectedCategory;


                        return (
                            matchesSearch &&
                            matchesCategory
                        );
                    }
                );


            displayMenuItems(
                filteredItems
            );
        }


        document
            .getElementById(
                "menu-search"
            )
            .addEventListener(
                "input",
                filterMenuItems
            );


        document
            .getElementById(
                "category-filter"
            )
            .addEventListener(
                "change",
                filterMenuItems
            );


        // --------------------------------
        // ORDER INTEGRATION PLACEHOLDER
        // --------------------------------

        function handleAddToOrder(item) {

            alert(
                `${item.name} is ready to be sent to the Order service.`
            );
        }


        // --------------------------------
        // INITIAL LOAD
        // --------------------------------

        loadMenuItems();

    </script>

</body>

</html>
