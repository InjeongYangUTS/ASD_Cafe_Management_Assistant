<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu Items | Cafe Management Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="management-container">

        <header class="management-header">
            <div>
                <h1>Menu Items</h1>
                <p>Manage cafe menu items and customer-facing prices.</p>
            </div>

            <a href="/" class="secondary-button">
                ← Back
            </a>
        </header>


        <!-- ADD MENU ITEM -->

        <section class="management-section">

            <div class="section-heading">
                <div>
                    <h2>Add Menu Item</h2>
                    <p>Create a new item for the cafe menu.</p>
                </div>
            </div>

            <form id="menu-form" class="management-form">

                <div class="form-row">

                    <div class="form-group">
                        <label for="menu-name">Name</label>

                        <input
                            type="text"
                            id="menu-name"
                            name="name"
                            placeholder="e.g. Cappuccino"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="menu-category">Category</label>

                        <select
                            id="menu-category"
                            name="category"
                            required
                        >
                            <option value="">Select category</option>
                            <option value="Coffee">Coffee</option>
                            <option value="Iced Coffee">Iced Coffee</option>
                            <option value="Drink">Drink</option>
                            <option value="Food">Food</option>
                            <option value="Dessert">Dessert</option>
                            <option value="Pastry">Pastry</option>
                        </select>
                    </div>

                </div>


                <div class="form-group">
                    <label for="menu-description">Description</label>

                    <textarea
                        id="menu-description"
                        name="description"
                        rows="3"
                        placeholder="Enter a short menu description"
                    ></textarea>
                </div>


                <div class="form-group">
                    <label for="menu-price">Price ($)</label>

                    <input
                        type="number"
                        id="menu-price"
                        name="price"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >
                </div>


                <div class="form-actions">

                    <button type="submit" class="primary-button">
                        Add Menu Item
                    </button>

                    <button type="reset" class="secondary-button">
                        Clear
                    </button>

                </div>

            </form>

        </section>


        <!-- CURRENT MENU -->

        <section class="management-section">

            <div class="section-heading">

                <div>
                    <h2>Current Menu</h2>
                    <p>Menu items available for customers to view and order.</p>
                </div>

                <input
                    type="text"
                    id="menu-search"
                    class="search-input"
                    placeholder="Search menu items..."
                >

            </div>


            <div class="table-wrapper">

                <table class="management-table">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Menu Item</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <!--
                        Menu items will now be loaded from
                        the backend API instead of being
                        hard-coded here.
                    -->

                    <tbody id="menu-table-body">
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script>

        // Backend API address
        const MENU_API = "http://localhost:5201/api/menus";


        // --------------------------------
        // LOAD MENU ITEMS FROM BACKEND
        // --------------------------------

        async function loadMenus() {

            try {

                const response = await fetch(MENU_API);

                if (!response.ok) {
                    throw new Error("Failed to load menu items");
                }

                const menus = await response.json();

                const tableBody =
                    document.getElementById("menu-table-body");

                tableBody.innerHTML = "";


                menus.forEach(menu => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${menu.menu_id}</td>

                        <td>${menu.name}</td>

                        <td>${menu.category}</td>

                        <td>${menu.description || ""}</td>

                        <td>
                            $${Number(menu.price).toFixed(2)}
                        </td>

                        <td>
                            <div class="action-buttons">

                                <button
                                    class="edit-button"
                                    data-id="${menu.menu_id}"
                                >
                                    Edit
                                </button>

                                <button
                                    class="delete-button"
                                    data-id="${menu.menu_id}"
                                >
                                    Delete
                                </button>

                            </div>
                        </td>
                    `;

                    tableBody.appendChild(row);

                });

            }

            catch (error) {

                console.error(
                    "Error loading menu items:",
                    error
                );

            }

        }


        // Load menu items when the page opens
        loadMenus();

    </script>

</body>

</html>
