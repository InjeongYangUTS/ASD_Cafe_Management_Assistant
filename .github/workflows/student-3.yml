name: Student 3 - Inventory & Restocking CI

on:
  push:
    paths:
      - "student-3/**"
      - "docker-compose.yml"
      - ".github/workflows/student-3.yml"
      - "tests/release2/post_commit/test_api_inventory.py"

  pull_request:
    paths:
      - "student-3/**"
      - "docker-compose.yml"
      - ".github/workflows/student-3.yml"
      - "tests/release2/post_commit/test_api_inventory.py"

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f student-3/backend/requirements.txt ]; then
            pip install -r student-3/backend/requirements.txt
          fi

          pip install pytest requests

      - name: Validate Python syntax
        run: |
          python -m compileall student-3/backend
          python -m compileall student-3/database

      - name: Validate Docker Compose
        run: |
          docker compose config


      - name: Validate Student 3 cloud baseline
        env:
          PUBLIC_HOST: localhost
          PUBLIC_SCHEME: http
        run: |
          export SHARED_SECRET_KEY="$(openssl rand -hex 32)"

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.cloud.yml \
            config --quiet

          python -m pytest \
            student-3/tests/test_cloud_baseline.py -v


      - name: Verify MCP and RAG are disabled in CI
        run: |
          echo "Checking that shared AI services are not Docker Compose services..."

          if docker compose config --services | grep -E '^(mcp|rag|ollama|ollama-init)$'; then
            echo "ERROR: MCP, RAG, or Ollama must not run as Docker Compose services in CI."
            exit 1
          fi

          echo "Checking that Student 3 retains MCP/RAG connection configuration..."
          docker compose config | grep -E 'MCP_SERVER_URL|MCP_URL|RAG_URL' || true

          echo "Shared MCP/RAG services are disabled during CI/CD."

      - name: Build Student 3 containers
        run: |
          docker compose build \
            student-3-database \
            student-3-backend \
            student-3-frontend
      
      - name: Start Student 3 services
        run: |
          docker compose up -d \
            student-3-database \
            student-3-backend \
            student-3-frontend

      - name: Wait for Student 3 services
        run: |
          echo "Waiting for database..."
          for i in {1..30}; do
            if curl -f http://localhost:7300/db/health; then
              echo "Database is ready"
              break
            fi
            sleep 2
          done

          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -f http://localhost:8300/api/health; then
              echo "Backend is ready"
              break
            fi
            sleep 2
          done

          echo "Waiting for frontend..."
          for i in {1..30}; do
            if curl -f http://localhost:5300/health; then
              echo "Frontend is ready"
              break
            fi
            sleep 2
          done

      - name: Run Student 3 tests
        run: |
          pytest student-3/tests -v
    
      - name: Show service status
        if: always()
        run: |
          docker compose ps

      - name: Show Student 3 logs on failure
        if: failure()
        run: |
          docker compose logs student-3-database
          docker compose logs student-3-backend
          docker compose logs student-3-frontend

  # Release 2: post-commit endpoint tests (Lab 11 post_commit_tests pattern)
  post_commit_tests:
    name: Post-commit endpoint tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Start services
        run: docker compose up -d --build student-3-database student-3-backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8300/api/inventory > /dev/null && exit 0
            sleep 2
          done
          echo "Backend did not start"; docker compose logs; exit 1

      - name: Run post-commit tests
        run: |
          mkdir -p reports/release2
          set +e
          python -m pytest tests/release2/post_commit/test_api_inventory.py -v > reports/release2/student-3-test-results.md
          status=$?
          echo "{\"student\": \"student-3\", \"status\": \"$([ $status -eq 0 ] && echo PASS || echo FAIL)\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> reports/release2/student-3-test-audit.jsonl
          cat reports/release2/student-3-test-results.md
          exit $status

      - name: Stop services
        if: always()
        run: docker compose down -v

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-3-post-commit-test-evidence
          path: reports/release2
