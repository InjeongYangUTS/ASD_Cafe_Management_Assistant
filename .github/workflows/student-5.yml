name: Student 5 - Payment and Billing CI

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"

on:
  push:
    paths:
      - "student-5/**"
      - "docker-compose.yml"
      - ".github/workflows/student-5.yml"
      - "tests/release2/post_commit/test_api_payments.py"

  pull_request:
    paths:
      - "student-5/**"
      - "docker-compose.yml"
      - ".github/workflows/student-5.yml"
      - "tests/release2/post_commit/test_api_payments.py"

  workflow_dispatch:

jobs:
  test:
    name: Run Student 5 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: |
          python -m pip install pytest flask flask-cors requests
          
          if [ -f student-5/backend/requirements.txt ]; then
            python -m pip install -r student-5/backend/requirements.txt
          fi
          
          if [ -f student-5/database/requirements.txt ]; then
            python -m pip install -r student-5/database/requirements.txt
          fi
          
          if [ -f student-5/frontend/requirements.txt ]; then
            python -m pip install -r student-5/frontend/requirements.txt
          fi

      - name: Run Student 5 automated tests
        run: python -m pytest student-5/tests -v

      - name: Verify required MCP and RAG routes and panels
        run: |
          grep -q '@app.get("/api/ai/mcp")' student-5/backend/app.py
          grep -q '@app.post("/api/ai/mcp")' student-5/backend/app.py
          grep -q '@app.post("/api/ai/rag")' student-5/backend/app.py
          grep -q 'id="mcpMessage"' student-5/frontend/index.html
          grep -q 'id="ragSources"' student-5/frontend/index.html

  build:
    name: Build Student 5 Docker Services
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Student 5 database service
        run: docker compose build student-5-database

      - name: Build Student 5 backend service
        run: docker compose build student-5-backend

      - name: Build Student 5 frontend service
        run: docker compose build student-5-frontend

  # Release 2: post-commit endpoint tests (Lab 11 post_commit_tests pattern)
  post_commit_tests:
    name: Post-commit endpoint tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Start services
        run: docker compose up -d --build student-5-database student-5-backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8500/api/payments > /dev/null && exit 0
            sleep 2
          done
          echo "Backend did not start"; docker compose logs; exit 1

      - name: Run post-commit tests
        run: |
          mkdir -p reports/release2
          set +e
          python -m pytest tests/release2/post_commit/test_api_payments.py -v > reports/release2/student-5-test-results.md
          status=$?
          echo "{\"student\": \"student-5\", \"status\": \"$([ $status -eq 0 ] && echo PASS || echo FAIL)\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> reports/release2/student-5-test-audit.jsonl
          cat reports/release2/student-5-test-results.md
          exit $status

      - name: Stop services
        if: always()
        run: docker compose down -v

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-5-post-commit-test-evidence
          path: reports/release2
