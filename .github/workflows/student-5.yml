name: Student 5 - Payment and Billing CI

on:
  push:
    paths:
      - "student-5/**"
      - "docker-compose.yml"
      - ".github/workflows/student-5.yml"

  pull_request:
    paths:
      - "student-5/**"
      - "docker-compose.yml"
      - ".github/workflows/student-5.yml"

  workflow_dispatch:

jobs:
  test:
    name: Run Student 5 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: |
          python -m pip install pytest flask flask-cors requests
          
          if [ -f student-5/backend/requirements.txt ]; then
            python -m pip install -r student-5/backend/requirements.txt
          fi
          
          if [ -f student-5/database/requirements.txt ]; then
            python -m pip install -r student-5/database/requirements.txt
          fi
          
          if [ -f student-5/frontend/requirements.txt ]; then
            python -m pip install -r student-5/frontend/requirements.txt
          fi

      - name: Run Student 5 automated tests
        run: python -m pytest student-5/tests -v

  build:
    name: Build Student 5 Docker Services
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Student 5 database service
        run: docker compose build student-5-database

      - name: Build Student 5 backend service
        run: docker compose build student-5-backend

      - name: Build Student 5 frontend service
        run: docker compose build student-5-frontend