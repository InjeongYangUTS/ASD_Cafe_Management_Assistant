name: Student 2 CI

on:
  push:
    branches:
      - student-2-menu-recipe
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  student2-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------- Backend ----------
      - name: Install backend dependencies
        run: |
          pip install -r student-2/backend/requirements.txt
          pip install pytest

      - name: Install database dependencies
        run: |
          pip install -r student-2/database/requirements.txt

      - name: Start database service
        run: |
          python student-2/database/app.py &
          sleep 3
        
      - name: Run backend tests
        run: |
          pytest student-2/tests/test_backend.py -v

      # ---------- Frontend ----------
      - name: Install frontend dependencies
        run: |
          pip install -r student-2/frontend/requirements.txt

      # ---------- Database ----------
      - name: Verify database service
        run: |
          python -m py_compile student-2/database/app.py

      # ---------- Docker ----------
      - name: Build Student 2 containers
        run: |
          docker compose build \
            student2-database \
            student2-backend \
            student2-frontend

  # Release 2: post-commit endpoint tests (Lab 11 post_commit_tests pattern)
  post_commit_tests:
    name: Post-commit endpoint tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Start services
        run: docker compose up -d --build student2-database student2-backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5201/api/menus > /dev/null && exit 0
            sleep 2
          done
          echo "Backend did not start"; docker compose logs; exit 1

      - name: Run post-commit tests
        run: |
          mkdir -p reports/release2
          set +e
          python -m pytest tests/release2/post_commit/test_api_menus.py -v > reports/release2/student-2-test-results.md
          status=$?
          echo "{\"student\": \"student-2\", \"status\": \"$([ $status -eq 0 ] && echo PASS || echo FAIL)\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> reports/release2/student-2-test-audit.jsonl
          cat reports/release2/student-2-test-results.md
          exit $status

      - name: Stop services
        if: always()
        run: docker compose down -v

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-2-post-commit-test-evidence
          path: reports/release2
