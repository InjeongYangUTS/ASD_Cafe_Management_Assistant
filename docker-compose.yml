services:

  student2-backend:
    build:
      context: ./student-2
      dockerfile: backend/Dockerfile
    container_name: student2-backend
    ports:
      - "5201:5201"
    networks:
      - cafe-network

  student2-frontend:
    build:
      context: ./student-2/frontend
      dockerfile: Dockerfile
    container_name: student2-frontend
    ports:
      - "5200:5200"
    depends_on:
      - student2-backend
    networks:
      - cafe-network

networks:
  cafe-network:
    driver: bridge