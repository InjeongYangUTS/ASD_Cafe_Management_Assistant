<article class="s1-review" id="review-{{ review.id }}">

    <div class="s1-message error" style="margin-bottom:12px;">
        <strong>Delete this review?</strong>
        This cannot be undone.
    </div>

    <div class="s1-review-head">
        <h3>{{ review.title or 'Review' }}</h3>
        <span class="s1-star-display"
              title="{{ review.rating }} out of 5">{{ '★' * review.rating }}{{ '☆' * (5 - review.rating) }}</span>
    </div>

    <p>{{ review.comment }}</p>

    <div class="s1-actions">

        <button class="s1-button danger"
                hx-post="/review/{{ review.id }}/delete"
                hx-target="#my-reviews"
                hx-swap="outerHTML"
                hx-disabled-elt="this">Yes, delete it</button>

        <button class="s1-button ghost"
                hx-get="/review/{{ review.id }}/card"
                hx-target="#review-{{ review.id }}"
                hx-swap="outerHTML">Keep it</button>

        <span class="s1-indicator">Deleting&hellip;</span>

    </div>

</article>
