<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Billing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #fffdf9;
            color: #333333;
        }

        header {
            position: relative;
            padding: 50px 7% 30px;
            text-align: center;
            background-color: #fffdf9;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 38px;
            font-weight: 700;
            color: #333333;
        }

        header p {
            margin: 0;
            font-size: 16px;
            color: #777777;
        }

        .back-button {
            position: absolute;
            top: 48px;
            right: 7%;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 10px 16px;

            background-color: #fff9e6;
            color: #555555;

            border: 1px solid #f6df9f;
            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            text-decoration: none;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .back-button:hover {
            background-color: #fff3d6;
            border-color: #efd277;
            transform: translateY(-1px);
        }

        main {
            width: 92%;
            max-width: 1150px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            padding: 16px 20px;
            margin-bottom: 25px;

            background-color: #ffffff;
            border: 2px solid #f6df9f;
            border-radius: 14px;

            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.05);
        }

        .status {
            font-weight: 700;
        }

        .connected {
            color: #08782f;
        }

        .disconnected {
            color: #c62828;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 25px;
        }

        .card {
            padding: 28px;

            background-color: #ffffff;
            border: 2px solid #f6df9f;
            border-radius: 18px;

            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }

        .grid .card:nth-child(2) {
            border-color: #f4c6d7;
        }

        .card h2 {
            margin: 0 0 22px;
            font-size: 24px;
            font-weight: 700;
            color: #333333;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 14px;
            font-weight: 600;
            color: #444444;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;

            border: 1px solid #dddddd;
            border-radius: 8px;

            background-color: #ffffff;
            color: #333333;

            font: inherit;
            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #ebaec5;
            box-shadow: 0 0 0 3px rgba(244, 198, 215, 0.25);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            padding: 12px 20px;
            margin-top: 20px;

            border: none;
            border-radius: 8px;

            background-color: #F4C6D7;
            color: #333333;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {
            background-color: #EBAEC5;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
        }

        .secondary {
            margin-top: 0;
            background-color: #fff3d6;
            color: #6f5818;
            border: 1px solid #f6df9f;
        }

        .secondary:hover {
            background-color: #f6df9f;
        }

        .message {
            display: none;
            padding: 12px 14px;
            margin-top: 18px;
            border-radius: 8px;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .success {
            display: block;
            color: #08782f;
            background-color: #eaf5ed;
            border: 1px solid #c8e5d0;
        }

        .error {
            display: block;
            color: #c62828;
            background-color: #fde8e8;
            border: 1px solid #f5bcbc;
        }

        .records {
            margin-top: 25px;
        }

        .records h2 {
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
        }

        th,
        td {
            padding: 13px 14px;
            border-bottom: 1px solid #eeeeee;
            text-align: left;
            white-space: nowrap;
            font-size: 14px;
        }

        th {
            background-color: #fff9e6;
            color: #333333;
            font-size: 13px;
            font-weight: 700;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: #fffafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 760px) {
            header {
                padding: 85px 20px 30px;
            }

            header h1 {
                font-size: 30px;
            }

            .back-button {
                top: 25px;
                right: 20px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .status-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .secondary {
                width: 100%;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <header>

        <a
            id="backDashboardLink"
            href="http://localhost:5100/staff-dashboard"
            class="back-button"
        >
            ← Back to Staff Dashboard
        </a>

        <h1>Payment &amp; Billing</h1>
        <p>Manage payments, refunds and transaction records.</p>

    </header>

    <main>

        <section class="status-bar">
            <div>
                Backend status:
                <span id="backendStatus" class="status">
                    Checking...
                </span>
            </div>

            <button id="refreshPaymentsButton" class="secondary" onclick="loadPayments()">
                Refresh Payments
            </button>
        </section>

        <section class="grid">

            <div class="card">
                <h2>Process Payment</h2>

                <form id="paymentForm">

                    <label for="orderId">Order ID</label>
                    <input id="orderId" type="number" min="1" required>

                    <label for="customerId">Customer ID</label>
                    <input id="customerId" type="number" min="1" required>

                    <label for="amount">Amount ($)</label>
                    <input id="amount" type="number" min="0.01" step="0.01" required>

                    <label for="paymentMethod">Payment Method</label>
                    <select id="paymentMethod" required>
                        <option value="card">Card</option>
                        <option value="cash">Cash</option>
                        <option value="digital_wallet">
                            Digital Wallet
                        </option>
                    </select>

                    <button type="submit">
                        Process Payment
                    </button>

                </form>

                <div id="paymentMessage" class="message"></div>
            </div>

            <div id="refundCard" class="card">
                <h2>Process Refund</h2>

                <form id="refundForm">

                    <label for="paymentId">Payment ID</label>
                    <input id="paymentId" type="number" min="1" required>

                    <label for="refundAmount">Refund Amount ($)</label>
                    <input id="refundAmount" type="number" min="0.01" step="0.01" required>

                    <label for="refundReason">Reason</label>
                    <textarea id="refundReason" required></textarea>

                    <label for="requestedBy">
                        Requested By (Customer ID)
                    </label>

                    <input id="requestedBy" type="number" min="1" required>

                    <button type="submit">
                        Process Refund
                    </button>

                </form>

                <div id="refundMessage" class="message"></div>
            </div>

        </section>

        <section id="paymentRecords" class="card records">

            <h2>Payment Records</h2>

            <div class="table-container">
                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Order</th>
                            <th>Customer</th>
                            <th>Amount</th>
                            <th>Method</th>
                            <th>Status</th>
                            <th>Paid At</th>
                        </tr>
                    </thead>

                    <tbody id="paymentTable">
                        <tr>
                            <td colspan="7">
                                Loading payments...
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </section>

    </main>

    <script>
        const API_URL =
            `${window.location.protocol}//${window.location.hostname}:8500`;

        const PAGE_PARAMS = new URLSearchParams(window.location.search);
        const CUSTOMER_MODE = PAGE_PARAMS.get("mode") === "customer";

        function showMessage(elementId, message, successful) {
            const element = document.getElementById(elementId);

            element.textContent = message;
            element.className = successful
                ? "message success"
                : "message error";
        }

        async function checkBackend() {
            const status = document.getElementById("backendStatus");

            try {
                const response = await fetch(`${API_URL}/health`);

                if (!response.ok) {
                    throw new Error("Backend unavailable");
                }

                const data = await response.json();

                status.textContent =
                    data.status === "healthy"
                        ? "Connected"
                        : "Unhealthy";

                status.className =
                    data.status === "healthy"
                        ? "status connected"
                        : "status disconnected";

            } catch (error) {
                status.textContent = "Disconnected";
                status.className = "status disconnected";
            }
        }

        async function loadPayments() {
            const table = document.getElementById("paymentTable");

            try {
                const response = await fetch(`${API_URL}/api/payments`);
                const payments = await response.json();

                if (!response.ok) {
                    throw new Error(
                        payments.error || "Could not load payments"
                    );
                }

                if (payments.length === 0) {
                    table.innerHTML =
                        '<tr><td colspan="7">No payments found.</td></tr>';
                    return;
                }

                table.innerHTML = payments.map((payment) => `
                    <tr>
                        <td>${payment.id}</td>
                        <td>${payment.order_id}</td>
                        <td>${payment.customer_id}</td>
                        <td>$${Number(payment.amount).toFixed(2)}</td>
                        <td>${payment.payment_method}</td>
                        <td>${payment.payment_status}</td>
                        <td>${payment.paid_at || "-"}</td>
                    </tr>
                `).join("");

            } catch (error) {
                table.innerHTML = `
                    <tr>
                        <td colspan="7">${error.message}</td>
                    </tr>
                `;
            }
        }

        document
            .getElementById("paymentForm")
            .addEventListener("submit", async (event) => {
                event.preventDefault();

                const payment = {
                    order_id: Number(
                        document.getElementById("orderId").value
                    ),
                    customer_id: Number(
                        document.getElementById("customerId").value
                    ),
                    amount: Number(
                        document.getElementById("amount").value
                    ),
                    payment_method:
                        document.getElementById("paymentMethod").value
                };

                try {
                    const response = await fetch(
                        `${API_URL}/api/payments/process`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(payment)
                        }
                    );

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            result.error || "Payment failed"
                        );
                    }

                    showMessage(
                        "paymentMessage",
                        `Payment ${result.payment.id} processed successfully.`,
                        true
                    );
                if (CUSTOMER_MODE) {
                     const submitButton = event.target.querySelector(
                         'button[type="submit"]'
                    );
                    submitButton.disabled = true;
                    submitButton.textContent = "Payment Completed";
                } else {
                    event.target.reset();
                    loadPayments();
                }

                } catch (error) {
                    showMessage(
                        "paymentMessage",
                        error.message,
                        false
                    );
                }
            });

        document
            .getElementById("refundForm")
            .addEventListener("submit", async (event) => {
                event.preventDefault();

                const refund = {
                    payment_id: Number(
                        document.getElementById("paymentId").value
                    ),
                    refund_amount: Number(
                        document.getElementById("refundAmount").value
                    ),
                    refund_reason:
                        document.getElementById("refundReason").value,
                    requested_by: Number(
                        document.getElementById("requestedBy").value
                    )
                };

                try {
                    const response = await fetch(
                        `${API_URL}/api/refunds`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(refund)
                        }
                    );

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            result.error || "Refund failed"
                        );
                    }

                    showMessage(
                        "refundMessage",
                        `Refund processed. Remaining amount: $${Number(
                            result.remaining_amount
                        ).toFixed(2)}`,
                        true
                    );

                    event.target.reset();
                    loadPayments();

                } catch (error) {
                    showMessage(
                        "refundMessage",
                        error.message,
                        false
                    );
                }
            });

        function configureCustomerPayment() {
            if (!CUSTOMER_MODE) {
                return;
            }

            const orderId = PAGE_PARAMS.get("order_id");
            const customerId = PAGE_PARAMS.get("customer_id");
            const amount = PAGE_PARAMS.get("amount");

            const orderInput = document.getElementById("orderId");
            const customerInput = document.getElementById("customerId");
            const amountInput = document.getElementById("amount");

            if (!orderId || !customerId || !amount) {
                showMessage(
                    "paymentMessage",
                    "Missing order information. Please return to your order.",
                    false
                );
                return;
            }

            orderInput.value = orderId;
            customerInput.value = customerId;
            amountInput.value = Number(amount).toFixed(2);

            orderInput.readOnly = true;
            customerInput.readOnly = true;
            amountInput.readOnly = true;

            document.getElementById("refundCard").hidden = true;
            document.getElementById("paymentRecords").hidden = true;
            document.getElementById("refreshPaymentsButton").hidden = true;

            const backLink = document.getElementById("backDashboardLink");
            backLink.href = "http://localhost:5100/customer-dashboard";
            backLink.textContent = "← Back to Customer Dashboard";
            document.querySelector("header h1").textContent = "Pay for Your Order";
            document.querySelector("header p").textContent =
                "Confirm the order total and choose a payment method.";
        }

        configureCustomerPayment();
        checkBackend();

        if (!CUSTOMER_MODE) {
            loadPayments();
        }
    </script>

</body>

</html>
