<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Order &amp; Kitchen{% endblock %} · Cafe Management Assistant</title>

    <!-- Shared team theme (owned by the group - not modified by student 4) -->
    <link rel="stylesheet" href="/shared/css/style.css">

    <!-- Student 4 feature stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/order.css') }}">

    <!-- HTMX 2.0.10, vendored so the demo runs without internet access -->
    <script src="{{ url_for('static', filename='js/htmx.min.js') }}"></script>
</head>

<body class="s4-app">

    <header class="s4-topbar">

        <div>
            <h1>Order &amp; Kitchen Management</h1>
            <span class="s4-owner">Student 4 · Stella Kwon · student-4-frontend</span>
        </div>

        <nav class="s4-nav">
            <a href="/pos" class="{{ 'active' if active == 'pos' }}">POS</a>
            <a href="/kitchen" class="{{ 'active' if active == 'kitchen' }}">Kitchen Display</a>
            <a href="/status" class="{{ 'active' if active == 'status' }}">Order Status</a>
            <a href="{{ shared_home }}">← Staff Dashboard</a>
        </nav>

    </header>

    <main class="s4-page">
        {% block content %}{% endblock %}
    </main>

</body>

</html>
